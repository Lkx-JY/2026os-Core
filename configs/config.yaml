app:
  name: "core-linuxcommit"
  version: "1.0.0"

database:
  type: "milvus"
  host: "localhost"
  port: 19530
  collection_name: "linux_commits"

redis:
  host: "localhost"
  port: 6379
  db: 0
  task_ttl: 86400  # 任务过期时间 (秒)，默认 24 小时

model:
  embedding: "BAAI/bge-m3"
  reranker: "BAAI/bge-reranker-v2-m3"

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  api_key: ""
  base_url: ""

server:
  host: "0.0.0.0"
  port: 8000
  reload: true

logging:
  level: "INFO"
  log_dir: "logs"
